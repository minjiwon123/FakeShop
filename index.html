<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE FAKE SHOP / 2026</title>

    <style>
      /* 둥글둥글하고 통통한 느낌의 구글 폰트(Jua, Fredoka) 로드 */
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Jua&family=Montserrat:wght@700;900&display=swap');

      :root {
        --main-yellow: #fbf9e6;
        --point-red: #f15a31;
        --stroke-orange: #d74b29;
        --point-blue: #7cb8f7;
        --text-dark: #222222;
      }

      body,
      html {
        background: #000;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: 'Jua', 'Fredoka', sans-serif;
        overflow: hidden;
      }

      #kiosk-frame {
        width: 100%;
        height: 100vh;
        position: relative;
        background: var(--main-yellow);
        overflow: hidden;
        cursor: pointer;
      }

      #video-background {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }

      #screen-start {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .touch-msg {
        font-size: 3.2vh;
        font-weight: 400;
        text-align: center;
        color: #000;
        animation: text-glow-pulse 3s infinite ease-in-out;
      }

      @keyframes text-glow-pulse {
        0%,
        100% {
          color: #000000;
        }
        50% {
          color: #ffffff;
          text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }
      }

      #screen-main {
        display: none;
        width: 100%;
        height: 100%;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        background: var(--main-yellow);
        z-index: 1100;
      }

      .scan-header {
        width: 100%;
        padding: 8vh 0 1vh 0;
        text-align: center;
      }

      .scan-title {
        font-size: 4vh;
        color: var(--main-yellow);
        margin: 0;
        letter-spacing: 0.1vh;
        font-weight: 900;
        text-shadow:
          -1.5px -1.5px 0 var(--stroke-orange),
          1.5px -1.5px 0 var(--stroke-orange),
          -1.5px 1.5px 0 var(--stroke-orange),
          1.5px 1.5px 0 var(--stroke-orange),
          0px -1.5px 0 var(--stroke-orange),
          0px 1.5px 0 var(--stroke-orange),
          -1.5px 0px 0 var(--stroke-orange),
          1.5px 0px 0 var(--stroke-orange);
      }

      #canvas-container {
        margin: 1vh auto;
        width: 65vh;
        height: 65vh;
        max-width: 90vw;
        border: 5px dashed var(--stroke-orange);
        border-radius: 3vh;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.4);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .scan-dashboard {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 20vh;
        background: var(--point-blue);
        color: #fff;
        display: flex;
        padding: 1.5vh 0;
        box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      .dash-section {
        flex: 1.2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        border-right: 1px solid rgba(255, 255, 255, 0.4);
        padding-top: 1vh;
      }
      .dash-section:nth-child(1) {
        flex: 1.4;
      }
      .dash-section:nth-child(2) {
        flex: 0.7;
      }
      .dash-section:nth-child(3) {
        flex: 1.4;
      }
      .dash-section:last-child {
        border-right: none;
        flex: 1.3;
        justify-content: center;
        padding-top: 0;
      }

      .dash-label {
        font-size: 2vh;
        color: var(--main-yellow);
        margin-bottom: 1.5vh;
        font-weight: 900;
        text-shadow:
          -1px -1px 0 var(--stroke-orange),
          1px -1px 0 var(--stroke-orange),
          -1px 1px 0 var(--stroke-orange),
          1px 1px 0 var(--stroke-orange),
          0px -1px 0 var(--stroke-orange),
          0px 1px 0 var(--stroke-orange),
          -1px 0px 0 var(--stroke-orange),
          1px 0px 0 var(--stroke-orange);
      }

      .list-container {
        width: 90%;
        height: 12vh;
        overflow-y: hidden;
        display: flex;
        flex-direction: column;
        gap: 0.8vh;
        font-size: 2.1vh;
        text-align: center;
        color: var(--text-dark);
      }

      .qty-row,
      .price-row {
        color: var(--stroke-orange);
        font-weight: 700;
      }

      /* 결제하기 / 최종 결제 진행 공통 스타일 */
      .btn-pay-active {
        background: var(--point-red) !important;
        color: #fff !important;
        border: 3px solid #fff !important;
        padding: 2.2vh 3.5vh !important;
        border-radius: 2vh !important;
        font-size: 2.5vh !important;
        cursor: pointer;
        font-family: 'Jua', sans-serif !important;
        box-shadow: 0 6px 0px var(--stroke-orange) !important;
        transition:
          transform 0.05s ease-out,
          box-shadow 0.05s ease-out,
          background-color 0.05s ease-out !important;
        transform: translateY(0px);
        -webkit-tap-highlight-color: transparent; /* 터치 시 푸르스름한 잔상 하이라이트 완전히 파괴 */
      }

      /* 🌟 [추가] 자바스크립트 햅틱 클래스 연동 가동 스펙 (결제류 버튼 전용 터치 작동 상태) */
      .btn-pay-active.js-touched {
        background-color: var(--stroke-orange) !important;
        box-shadow: 0 2px 0px rgba(0, 0, 0, 0.2) !important;
        transform: translateY(4px) !important;
      }

      .modal {
        display: none;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        background: var(--main-yellow);
        z-index: 1200;
      }

      .modal-title {
        font-size: 6vh;
        margin-bottom: 4vh;
        color: var(--main-yellow);
        font-weight: 900;
        text-shadow:
          -2px -2px 0 var(--stroke-orange),
          2px -2px 0 var(--stroke-orange),
          -2px 2px 0 var(--stroke-orange),
          2px 2px 0 var(--stroke-orange),
          0px -2px 0 var(--stroke-orange),
          0px 2px 0 var(--stroke-orange),
          -2px 0px 0 var(--stroke-orange),
          2px 0px 0 var(--stroke-orange);
      }

      #cart-list {
        width: 65%;
        background: white;
        padding: 3vh 4vh;
        border: 4px solid var(--point-blue);
        border-radius: 2.5vh;
        color: var(--text-dark);
        margin-bottom: 4vh;
        font-size: 2.4vh;
        max-height: 40vh;
        overflow-y: auto;
      }

      #cart-list::-webkit-scrollbar {
        width: 12px;
      }
      #cart-list::-webkit-scrollbar-track {
        background: var(--main-yellow);
        border-radius: 10px;
      }
      #cart-list::-webkit-scrollbar-thumb {
        background: var(--point-blue);
        border: 2px solid #fff;
        border-radius: 10px;
      }

      .cart-total-bar {
        width: 65%;
        text-align: right;
        font-size: 3.2vh;
        color: var(--stroke-orange);
        margin-bottom: 4vh;
        font-weight: 900;
      }

      .back-box {
        display: none;
        position: absolute;
        top: 2vh;
        left: 4vw;
        z-index: 1300;
      }

      /* 이전으로 단추 스타일 */
      .btn-back-style {
        background: white !important;
        border: 3px solid var(--point-blue) !important;
        border-radius: 999px !important;
        padding: 0.8vh 3.2vh !important;
        font-size: 2.2vh !important;
        font-weight: 700 !important;
        cursor: pointer;
        color: var(--stroke-orange) !important;
        box-shadow: 0 4px 0px rgba(0, 0, 0, 0.08) !important;
        letter-spacing: -0.05vw !important;
        transition:
          transform 0.05s ease-out,
          box-shadow 0.05s ease-out,
          background-color 0.05s ease-out,
          color 0.05s ease-out !important;
        font-family: 'Jua', 'Fredoka', sans-serif !important;
        transform: translateY(0px);
        -webkit-tap-highlight-color: transparent;
      }

      /* 🌟 [추가] 자바스크립트 햅틱 클래스 연동 가동 스펙 (이전으로 및 LANGUAGE 버튼 전용 터치 작동 상태) */
      .btn-back-style.js-touched,
      .language-btn.js-touched {
        background-color: var(--point-blue) !important;
        color: white !important;
        box-shadow: 0 1px 0px rgba(0, 0, 0, 0.1) !important;
        transform: translateY(3px) !important;
      }

      .language-box {
        display: block;
        position: absolute;
        top: 2vh;
        right: 4vw;
        z-index: 1300;
      }

      /* LANGUAGE 메인 버튼 */
      .language-btn {
        background: white !important;
        border: 3px solid var(--point-blue) !important;
        border-radius: 999px !important;
        padding: 0.8vh 2.5vh !important;
        font-size: 2.2vh !important;
        font-weight: 700 !important;
        cursor: pointer;
        color: var(--stroke-orange) !important;
        box-shadow: 0 4px 0px rgba(0, 0, 0, 0.08) !important;
        letter-spacing: 0.05vw !important;
        transition:
          transform 0.05s ease-out,
          box-shadow 0.05s ease-out,
          background-color 0.05s ease-out,
          color 0.05s ease-out !important;
        font-family: 'Jua', 'Fredoka', sans-serif !important;
        transform: translateY(0px);
        -webkit-tap-highlight-color: transparent;
      }

      .language-menu {
        display: none;
        margin-top: 1vh;
        background: white;
        border: 3px solid var(--point-blue);
        border-radius: 1.5vh;
        overflow: hidden;
        min-width: 140px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      }

      /* 드롭다운 항목 단추 */
      .language-item {
        padding: 1.2vh 2vh !important;
        cursor: pointer;
        color: var(--text-dark) !important;
        font-size: 2vh !important;
        font-weight: 700 !important;
        background: white !important;
        transition:
          background-color 0.05s ease-out,
          color 0.05s ease-out !important;
        text-align: center !important;
        font-family: 'Jua', 'Fredoka', sans-serif !important;
        -webkit-tap-highlight-color: transparent;
      }

      /* 🌟 [추가] 자바스크립트 햅틱 클래스 연동 가동 스펙 (한국어/ENGLISH 리스트 전용 터치 작동 상태) */
      .language-item.js-touched {
        background-color: var(--point-red) !important;
        color: white !important;
      }

      .language-box.open .language-menu {
        display: block;
      }

      #barcode-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      #print-receipt-zone {
        display: none;
      }
    </style>
  </head>

  <body>
    <script>
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('selectstart', (e) => e.preventDefault());
    </script>

    <div class="back-box" id="global-back-box">
      <button
        class="btn-back-style"
        id="btn-top-back"
        onclick="handleBackAction()"
      >
        이전으로
      </button>
    </div>

    <div class="language-box" id="global-lang-box">
      <button class="language-btn">LANGUAGE</button>
      <div class="language-menu">
        <div class="language-item" onclick="changeToKorean()">한국어</div>
        <div class="language-item" onclick="loadEnglishScript()">ENGLISH</div>
      </div>
    </div>

    <div id="kiosk-frame">
      <video id="video-background" autoplay muted loop playsinline>
        <source src="intro_video.mp4" type="video/mp4" />
      </video>

      <div id="screen-start" onclick="startKiosk()">
        <div class="touch-msg" id="text-touch-msg">화면을 터치해 주세요.</div>
      </div>

      <div id="screen-main">
        <div class="scan-header">
          <h1 class="scan-title" id="text-scan-title">
            상품 바코드를 스캔해 주세요
          </h1>
        </div>

        <div id="canvas-container">
          <canvas id="faceCanvas" width="1280" height="1280"></canvas>
        </div>

        <div class="scan-dashboard">
          <div class="dash-section">
            <div class="dash-label" id="lbl-dash-name">상품 이름</div>
            <div id="dash-name-list" class="list-container"></div>
          </div>

          <div class="dash-section">
            <div class="dash-label" id="lbl-dash-qty">수량</div>
            <div id="dash-qty-list" class="list-container"></div>
          </div>

          <div class="dash-section">
            <div class="dash-label" id="lbl-dash-price">금액</div>
            <div id="dash-price-list" class="list-container"></div>
          </div>

          <div class="dash-section">
            <button
              class="btn-pay-active"
              id="btn-open-cart"
              onclick="openCart()"
            >
              결제하기
            </button>
          </div>
        </div>
      </div>

      <div id="modal-cart" class="modal">
        <h1 class="modal-title" id="text-modal-title">주문 리스트 확인</h1>
        <div id="cart-list"></div>
        <div class="cart-total-bar" id="cart-total-price">
          총 결제 금액: 0원
        </div>
        <button
          class="btn-pay-active"
          id="btn-final-pay"
          onclick="actionPrintAndReset()"
        >
          결제하기
        </button>
      </div>

      <input type="text" id="barcode-input" />
    </div>

    <script>
      let currentLang = 'ko';
      let unitQty = '개';
      let unitWon = '원';
      let textModalTotal = '총 결제 금액: ';
      let textBtnBack = '이전으로';

      let textRecListTitle = '[구매 확정 목록]';
      let textRecTotalQty = '총 수량';
      let textRecTotalPrice = '총 결제 금액';
      let textRecFooter =
        '안녕하세요~ The Fake Shop 입니다~<br />또 이용해 주세요!';

      const canvas = document.getElementById('faceCanvas');
      const ctx = canvas.getContext('2d');
      const barcodeInput = document.getElementById('barcode-input');
      const globalLangBox = document.getElementById('global-lang-box');
      const globalBackBox = document.getElementById('global-back-box');

      let scannedParts = [];

      const assetsInfo = {
        2030999: {
          name: '안유진의 눈',
          type: 'eye',
          src: 'assets/eye_yujin.png',
          price: 2748000,
        },
        1392010: {
          name: '오준현 교수님의 눈',
          type: 'eye',
          src: 'assets/eye_prof.png',
          price: 549000,
        },
        5203344587: {
          name: '신세경의 코',
          type: 'nose',
          src: 'assets/nose_sekyung.png',
          price: 142000,
        },
        77588517748: {
          name: '이도현의 입',
          type: 'mouth',
          src: 'assets/mouth_dohyun.png',
          price: 156000,
        },
        30920: {
          name: '비비의 점',
          type: 'mole',
          src: 'assets/mole_bibi.png',
          price: 53000,
        },
      };

      const baseImg = new Image();
      baseImg.src = 'assets/base_face.png';
      baseImg.onload = function () {
        draw();
      };

      const loadedImages = {};

      Object.keys(assetsInfo).forEach((code) => {
        const img = new Image();
        img.src = assetsInfo[code].src;
        loadedImages[code] = img;
        img.onload = draw;
      });

      function startKiosk() {
        document.getElementById('screen-start').style.display = 'none';
        document.getElementById('screen-main').style.display = 'flex';
        globalBackBox.style.display = 'block';
        barcodeInput.focus();
        draw();
      }

      function handleBackAction() {
        if (document.getElementById('modal-cart').style.display === 'flex') {
          document.getElementById('modal-cart').style.display = 'none';
          document.getElementById('screen-main').style.display = 'flex';
          barcodeInput.focus();
        } else {
          scannedParts = [];
          updateDashboards();
          draw();
          document.getElementById('screen-main').style.display = 'none';
          globalBackBox.style.display = 'none';
          document.getElementById('screen-start').style.display = 'flex';
        }
      }

      function draw() {
        ctx.clearRect(0, 0, 1280, 1280);
        if (baseImg.complete) {
          const scale = Math.max(1280 / baseImg.width, 1280 / baseImg.height);
          const x = (1280 - baseImg.width * scale) / 2;
          const y = (1280 - baseImg.height * scale) / 2;
          ctx.drawImage(
            baseImg,
            x,
            y,
            baseImg.width * scale,
            baseImg.height * scale,
          );
        }
        const sortedParts = [...scannedParts].sort((a, b) => {
          if (assetsInfo[a.code].type === 'mole') return 1;
          if (assetsInfo[b.code].type === 'mole') return -1;
          return 0;
        });
        sortedParts.forEach((part) => {
          const img = loadedImages[part.code];
          if (img && img.complete) {
            ctx.drawImage(img, part.randomX, part.randomY, 1280, 1280);
          }
        });
      }

      barcodeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const valStr = e.target.value.replace(/\s/g, '').trim();
          const valNum = Number(valStr);
          const info = assetsInfo[valStr] || assetsInfo[valNum];

          if (info) {
            const exactCode =
              Object.keys(assetsInfo).find(
                (key) => key == valStr || Number(key) == valNum,
              ) || valStr;

            scannedParts.push({
              code: exactCode,
              name: info.name,
              price: info.price,
              randomX: (Math.random() - 0.5) * 180,
              randomY: (Math.random() - 0.5) * 300,
            });
            updateDashboards();
            draw();
          }
          e.target.value = '';
        }
      });

      function updateDashboards() {
        const nameDiv = document.getElementById('dash-name-list');
        const qtyDiv = document.getElementById('dash-qty-list');
        const priceDiv = document.getElementById('dash-price-list');
        const summary = {};

        scannedParts.forEach((p) => {
          const currentName = assetsInfo[p.code].name;
          if (!summary[currentName]) {
            summary[currentName] = { count: 0, totalPrice: 0 };
          }
          summary[currentName].count += 1;
          summary[currentName].totalPrice += p.price;
        });

        nameDiv.innerHTML = '';
        qtyDiv.innerHTML = '';
        priceDiv.innerHTML = '';
        Object.entries(summary).forEach(([name, data]) => {
          nameDiv.innerHTML += `<div>${name}</div>`;
          qtyDiv.innerHTML += `<div class="qty-row">${data.count}${unitQty}</div>`;
          priceDiv.innerHTML += `<div class="price-row">${data.totalPrice.toLocaleString()}${unitWon}</div>`;
        });
      }

      function openCart() {
        document.getElementById('screen-main').style.display = 'none';
        const list = document.getElementById('cart-list');
        list.innerHTML = '';
        const summary = {};
        let grandTotal = 0;

        scannedParts.forEach((p) => {
          const currentName = assetsInfo[p.code].name;
          if (!summary[currentName]) {
            summary[currentName] = { count: 0, totalPrice: 0 };
          }
          summary[currentName].count += 1;
          summary[currentName].totalPrice += p.price;
          grandTotal += p.price;
        });

        Object.entries(summary).forEach(([name, data]) => {
          list.innerHTML += `
            <div style="display:flex; justify-content:space-between; margin-bottom:1.5vh;">
                <span>${name} (${data.count}${unitQty})</span>
                <span style="color:var(--stroke-orange); font-weight:900;">${data.totalPrice.toLocaleString()}${unitWon}</span>
            </div>
          `;
        });
        document.getElementById('cart-total-price').innerText =
          `${textModalTotal}${grandTotal.toLocaleString()}${unitWon}`;
        document.getElementById('modal-cart').style.display = 'flex';
      }

      function actionPrintAndReset() {
        let facePartImagesHTML = '';
        const sortedParts = [...scannedParts].sort((a, b) => {
          if (assetsInfo[a.code].type === 'mole') return 1;
          if (assetsInfo[b.code].type === 'mole') return -1;
          return 0;
        });

        sortedParts.forEach((part) => {
          const scaleRatio = 48 / 1280;
          const moveX = part.randomX * scaleRatio;
          const moveY = part.randomY * scaleRatio;
          facePartImagesHTML += `<img style="position: absolute; width: 48mm; height: 48mm; top: 0; left: 0; object-fit: cover; transform-origin: top left; mix-blend-mode: multiply; filter: grayscale(1) brightness(0) contrast(999); image-rendering: pixelated; transform: translate(${moveX}mm, ${moveY}mm);" src="${assetsInfo[part.code].src}" />`;
        });

        let itemsListHTML = '';
        const summary = {};
        let grandTotal = 0;
        scannedParts.forEach((p) => {
          const currentName = assetsInfo[p.code].name;
          if (!summary[currentName]) {
            summary[currentName] = { count: 0, totalPrice: 0 };
          }
          summary[currentName].count += 1;
          summary[currentName].totalPrice += p.price;
          grandTotal += p.price;
        });

        let finalTotalCount = 0;
        Object.entries(summary).forEach(([name, data]) => {
          finalTotalCount += data.count;
          itemsListHTML += `<div style="display: flex; justify-content: space-between; margin: 4px 0; font-size: 11px;"><span>${name} x${data.count}</span><span>${data.totalPrice.toLocaleString()}${unitWon}</span></div>`;
        });

        const receiptDate =
          currentLang === 'en'
            ? new Date().toLocaleString('en-US')
            : new Date().toLocaleString();

        const iframe = document.createElement('iframe');
        iframe.style.position = 'fixed';
        iframe.style.width = '0';
        iframe.style.height = '0';
        iframe.style.border = '0';
        document.body.appendChild(iframe);

        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(`
          <html>
          <head>
            <style>
              @page { size: 58mm auto; margin: 0; }

        `);
        doc.close();

        globalLangBox.style.display = 'none';

      function loadEnglishScript() {
        const oldScript = document.getElementById('en-script');
        if (oldScript) oldScript.remove();
        const script = document.createElement('script');
        script.id = 'en-script';
        script.src = 'locale-en.js?v=' + Date.now();
        document.body.appendChild(script);
      }

      const languageBtn = document.querySelector('.language-btn');
      languageBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        globalLangBox.classList.toggle('open');
      });
      document.addEventListener('click', () => {
        globalLangBox.classList.remove('open');
      });

      // 🌟 [추가] 터치스크린 전용 초정밀 전역 햅틱 트래킹 매니저 주입
      // 이 스크립트가 300ms 딜레이를 무시하고 살결이 닿는 즉시 강제로 애니메이션 클래스를 켜고 꺼줍니다.
      const targetButtons =
        '.btn-pay-active, .btn-back-style, .language-btn, .language-item';

      function addTouchEffect(target) {
        const btn = target.closest(targetButtons);

        if (btn) {
          btn.classList.add('js-touched');
        }
      }

      function removeTouchEffect(target) {
        const btn = target.closest(targetButtons);

        if (btn) {
          setTimeout(() => {
            btn.classList.remove('js-touched');
          }, 80);
        }
      }

      /* 터치 */
      document.addEventListener(
        'touchstart',
        (e) => {
          addTouchEffect(e.target);
        },
        { passive: true },
      );

      document.addEventListener(
        'touchend',
        (e) => {
          removeTouchEffect(e.target);
        },
        { passive: true },
      );

      /* 마우스 */
      document.addEventListener('mousedown', (e) => {
        addTouchEffect(e.target);
      });

      document.addEventListener('mouseup', (e) => {
        removeTouchEffect(e.target);
      });

      /* 터치모니터 */
      document.addEventListener('pointerdown', (e) => {
        addTouchEffect(e.target);
      });

      document.addEventListener('pointerup', (e) => {
        removeTouchEffect(e.target);
      });
    </script>
  </body>
</html>
