<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE FAKE SHOP / 2026</title>

    <style>
      /* 둥글둥글하고 통통한 느낌의 구글 폰트(Jua, Fredoka) 로드 */
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Jua&family=Montserrat:wght@700;900&display=swap');

      :root {
        --main-yellow: #fbf9e6;
        --point-red: #f15a31;
        --stroke-orange: #d74b29;
        --point-blue: #7cb8f7;
        --text-dark: #222222;
      }

      body,
      html {
        background: #000;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: 'Jua', 'Fredoka', sans-serif;
        overflow: hidden;
      }

      #kiosk-frame {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        background: var(--main-yellow);
        overflow: hidden;
        cursor: pointer;
      }

      #video-background {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }

      #screen-start {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .touch-msg {
        font-size: 3.2vh;
        font-weight: 400;
        text-align: center;
        color: #000;
        animation: text-glow-pulse 3s infinite ease-in-out;
      }

      @keyframes text-glow-pulse {
        0%,
        100% {
          color: #000000;
        }
        50% {
          color: #ffffff;
          text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }
      }

      #screen-main {
        display: none;
        position: absolute;
        inset: 0;

        background: var(--main-yellow);
        z-index: 1100;

        flex-direction: column;
        align-items: center;
      }

      .scan-header {
        width: 100%;
        padding: 8vh 0 1vh 0;
        text-align: center;
      }

      .scan-title {
        font-size: 4vh;
        color: var(--main-yellow);
        margin: 0;
        letter-spacing: 0.1vh;
        font-weight: 900;
        text-shadow:
          -1.5px -1.5px 0 var(--stroke-orange),
          1.5px -1.5px 0 var(--stroke-orange),
          -1.5px 1.5px 0 var(--stroke-orange),
          1.5px 1.5px 0 var(--stroke-orange),
          0px -1.5px 0 var(--stroke-orange),
          0px 1.5px 0 var(--stroke-orange),
          -1.5px 0px 0 var(--stroke-orange),
          1.5px 0px 0 var(--stroke-orange);
      }

      #canvas-container {
        margin-top: 1vh;
        width: min(70vw, 65vh);
        height: min(70vw, 65vh);

        border: 5px dashed var(--stroke-orange);
        border-radius: 3vh;
        background: rgba(255, 255, 255, 0.4);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .scan-dashboard {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 20vh;
        background: var(--point-blue);
        color: #fff;
        display: flex;
        padding: 1.5vh 0;
        box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      .back-box,
      .language-box {
        top: 1vh;
      }

      .dash-section {
        flex: 1.2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        border-right: 1px solid rgba(255, 255, 255, 0.4);
        padding-top: 1vh;
      }
      .dash-section:nth-child(1) {
        flex: 1.4;
      }
      .dash-section:nth-child(2) {
        flex: 0.7;
      }
      .dash-section:nth-child(3) {
        flex: 1.4;
      }
      .dash-section:last-child {
        border-right: none;
        flex: 1.3;
        justify-content: center;
        padding-top: 0;
      }

      .dash-label {
        font-size: 2vh;
        color: var(--main-yellow);
        margin-bottom: 1.5vh;
        font-weight: 900;
        text-shadow:
          -1px -1px 0 var(--stroke-orange),
          1px -1px 0 var(--stroke-orange),
          -1px 1px 0 var(--stroke-orange),
          1px 1px 0 var(--stroke-orange),
          0px -1px 0 var(--stroke-orange),
          0px 1px 0 var(--stroke-orange),
          -1px 0px 0 var(--stroke-orange),
          1px 0px 0 var(--stroke-orange);
      }

      .list-container {
        width: 90%;
        height: 12vh;
        overflow-y: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.8vh;
        font-size: 2.1vh;
        text-align: center;
        color: var(--text-dark);
      }
      .list-container::-webkit-scrollbar {
        display: none;
      }

      .qty-row,
      .price-row {
        color: var(--stroke-orange);
        font-weight: 700;
      }

      .item-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .item-delete {
        border: none;
        background: none;
        color: #f15a31;
        font-size: 2vh;
        font-weight: bold;
        cursor: pointer;
      }

      .qty-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .qty-btn {
        border: none;
        background: white;
        color: #f15a31;
        border-radius: 50%;
        width: 2.5vh;
        height: 2.5vh;
        font-size: 1.8vh;
        font-weight: bold;
        cursor: pointer;
        line-height: 1;
      }

      /* 결제하기 버튼 크기 날씬하고 세련되게 보정 세팅 */
      .btn-pay-active {
        background: var(--point-red) !important;
        color: #fff !important;
        border: 3px solid #fff !important;
        padding: 1.5vh 3vh !important;
        border-radius: 2vh !important;
        font-size: 2.3vh !important;
        cursor: pointer;
        font-family: 'Jua', sans-serif !important;
        box-shadow: 0 5px 0px var(--stroke-orange) !important;
        transition:
          transform 0.05s ease-out,
          box-shadow 0.05s ease-out,
          background-color 0.05s ease-out !important;
        transform: translateY(0px);
        -webkit-tap-highlight-color: transparent;
      }

      .btn-pay-active.js-touched {
        background-color: var(--stroke-orange) !important;
        box-shadow: 0 2px 0px rgba(0, 0, 0, 0.2) !important;
        transform: translateY(3px) !important;
      }

      .modal {
        display: none;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        background: var(--main-yellow);
        z-index: 1200;
      }

      .modal-title {
        font-size: 6vh;
        margin-bottom: 4vh;
        color: var(--main-yellow);
        font-weight: 900;
        text-shadow:
          -2px -2px 0 var(--stroke-orange),
          2px -2px 0 var(--stroke-orange),
          -2px 2px 0 var(--stroke-orange),
          2px 2px 0 var(--stroke-orange),
          0px -2px 0 var(--stroke-orange),
          0px 2px 0 var(--stroke-orange),
          -2px 0px 0 var(--stroke-orange),
          2px 0px 0 var(--stroke-orange);
      }

      #cart-list {
        width: 65%;
        background: white;
        padding: 3vh 4vh;
        border: 4px solid var(--point-blue);
        border-radius: 2.5vh;
        color: var(--text-dark);
        margin-bottom: 4vh;
        font-size: 2.4vh;
        max-height: 40vh;
        overflow-y: auto;
      }

      #cart-list::-webkit-scrollbar {
        width: 12px;
      }
      #cart-list::-webkit-scrollbar-track {
        background: var(--main-yellow);
        border-radius: 10px;
      }
      #cart-list::-webkit-scrollbar-thumb {
        background: var(--point-blue);
        border: 2px solid #fff;
        border-radius: 10px;
      }

      .cart-total-bar {
        width: 65%;
        text-align: right;
        font-size: 3.2vh;
        color: var(--stroke-orange);
        margin-bottom: 4vh;
        font-weight: 900;
      }

      .back-box {
        display: none;
        position: absolute;
        top: 2vh;
        left: 4vw;
        z-index: 1300;
      }

      .btn-back-style {
        background: white !important;
        border: 3px solid var(--point-blue) !important;
        border-radius: 999px !important;
        padding: 0.8vh 3.2vh !important;
        font-size: 2.2vh !important;
        font-weight: 700 !important;
        cursor: pointer;
        color: var(--stroke-orange) !important;
        box-shadow: 0 4px 0px rgba(0, 0, 0, 0.08) !important;
        letter-spacing: -0.05vw !important;
        transition:
          transform 0.05s ease-out,
          box-shadow 0.05s ease-out,
          background-color 0.05s ease-out,
          color 0.05s ease-out !important;
        font-family: 'Jua', 'Fredoka', sans-serif !important;
        transform: translateY(0px);
        -webkit-tap-highlight-color: transparent;
      }

      .btn-back-style.js-touched,
      .language-btn.js-touched {
        background-color: var(--point-blue) !important;
        color: white !important;
        box-shadow: 0 1px 0px rgba(0, 0, 0, 0.1) !important;
        transform: translateY(3px) !important;
      }

      .language-box {
        display: block;
        position: absolute;
        top: 2vh;
        right: 4vw;
        z-index: 1300;
      }

      .language-btn {
        background: white !important;
        border: 3px solid var(--point-blue) !important;
        border-radius: 999px !important;
        padding: 0.8vh 2.5vh !important;
        font-size: 2.2vh;
        font-weight: 700 !important;
        cursor: pointer;
        color: var(--stroke-orange) !important;
        box-shadow: 0 4px 0px rgba(0, 0, 0, 0.08) !important;
        letter-spacing: 0.05vw !important;
        transition:
          transform 0.05s ease-out,
          box-shadow 0.05s ease-out,
          background-color 0.05s ease-out,
          color 0.05s ease-out !important;
        font-family: 'Jua', 'Fredoka', sans-serif !important;
        transform: translateY(0px);
        -webkit-tap-highlight-color: transparent;
      }

      .language-menu {
        display: none;
        margin-top: 1vh;
        background: white;
        border: 3px solid var(--point-blue);
        border-radius: 1.5vh;
        overflow: hidden;
        min-width: 140px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      }

      .language-item {
        padding: 1.2vh 2vh !important;
        cursor: pointer;
        color: var(--text-dark) !important;
        font-size: 2vh !important;
        font-weight: 700 !important;
        background: white !important;
        transition:
          background-color 0.05s ease-out,
          color 0.05s ease-out !important;
        text-align: center !important;
        font-family: 'Jua', 'Fredoka', sans-serif !important;
        -webkit-tap-highlight-color: transparent;
      }

      .language-item.js-touched {
        background-color: var(--point-red) !important;
        color: white !important;
      }

      .language-box.open .language-menu {
        display: block;
      }

      #barcode-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      #print-receipt-zone {
        display: none;
      }
    </style>
  </head>

    <script>
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('selectstart', (e) => e.preventDefault());
    </script>

    <div class="back-box" id="global-back-box">
      <button
        class="btn-back-style"
        id="btn-top-back"
        onclick="handleBackAction()"
      >
        이전으로
      </button>
    </div>

    <div class="language-box" id="global-lang-box">
      <button class="language-btn">LANGUAGE</button>
      <div class="language-menu">
        <div class="language-item" onclick="changeToKorean()">한국어</div>
        <div class="language-item" onclick="loadEnglishScript()">ENGLISH</div>
      </div>
    </div>

    <div id="kiosk-frame">
      <video id="video-background" autoplay muted loop playsinline>
        <source src="intro_video.mp4" type="video/mp4" />

        <div id="canvas-container">
          <canvas id="faceCanvas" width="1280" height="1280"></canvas>
        </div>

        <div class="scan-dashboard">
          <div class="dash-section">
            <div class="dash-label" id="lbl-dash-name">상품 이름</div>
            <div id="dash-name-list" class="list-container"></div>
          </div>

          <div class="dash-section">
            <div class="dash-label" id="lbl-dash-qty">수량</div>

          <div class="dash-section">
            <div class="dash-label" id="lbl-dash-price">금액</div>
            <div id="dash-price-list" class="list-container"></div>
          </div>

          <div class="dash-section">
            <button
              class="btn-pay-active"
              id="btn-open-cart"
              onclick="openCart()"
            >
              결제하기
            </button>
          </div>
        </div>
      </div>

      <div id="modal-cart" class="modal">
        <h1 class="modal-title" id="text-modal-title">주문 리스트 확인</h1>
        <div id="cart-list"></div>
        <div class="cart-total-bar" id="cart-total-price">

        <button
          class="btn-pay-active"
          id="btn-final-pay"
          onclick="actionPrintAndReset()"
        >
          결제하기
        </button>
      </div>

      <input type="text" id="barcode-input" />
    </div>

      function startKiosk() {

      function handleBackAction() {
        if (document.getElementById('modal-cart').style.display === 'flex') {
          document.getElementById('modal-cart').style.display = 'none';
          document.getElementById('screen-main').style.display = 'flex';
          barcodeInput.focus();

          draw();
          document.getElementById('screen-main').style.display = 'none';
          globalBackBox.style.display = 'none';
          document.getElementById('screen-start').style.display = 'flex';
        }

      function draw() {
        ctx.clearRect(0, 0, 1280, 1280);
        if (baseImg.complete) {
          const scale = Math.max(1280 / baseImg.width, 1280 / baseImg.height);
          const x = (1280 - baseImg.width * scale) / 2;
          const y = (1280 - baseImg.height * scale) / 2;
          ctx.drawImage(
            baseImg,
            x,
            y,
            baseImg.width * scale,
            baseImg.height * scale,
          );
        }
        const sortedParts = [...scannedParts].sort((a, b) => {
          if (assetsInfo[a.code].type === 'mole') return 1;
          if (assetsInfo[b.code].type === 'mole') return -1;
          return 0;
        });
        sortedParts.forEach((part) => {
          const img =
            loadedImages[part.code] || loadedImages[String(part.code)];
          if (img && img.complete) {
            ctx.drawImage(img, part.randomX, part.randomY, 1280, 1280);
          }
        });
      }

      barcodeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const valStr = e.target.value.replace(/\s/g, '').trim();
          const valNum = Number(valStr);
          const info = assetsInfo[valStr] || assetsInfo[valNum];

          if (info) {
            const exactCode =
              Object.keys(assetsInfo).find(
                (key) => key == valStr || Number(key) == valNum,
              ) || valStr;

            scannedParts.push({
              code: exactCode,
              name: info.name,
              price: info.price,
              randomX: (Math.random() - 0.5) * 180,
              randomY: (Math.random() - 0.5) * 300,
            });
            updateDashboards();
            draw();
          }
          e.target.value = '';
        }
      });

      function updateDashboards() {
        const nameDiv = document.getElementById('dash-name-list');
        const qtyDiv = document.getElementById('dash-qty-list');
        const priceDiv = document.getElementById('dash-price-list');

        const summary = new Map();

        scannedParts.forEach((p) => {
          const currentName = assetsInfo[p.code].name;

          if (summary.has(currentName)) {
            const old = summary.get(currentName);

            summary.delete(currentName);

            summary.set(currentName, {
              count: old.count + 1,
              totalPrice: old.totalPrice + p.price,
              code: p.code,
            });
          } else {
            summary.set(currentName, {
              count: 1,
              totalPrice: p.price,
              code: p.code,
            });
          }
        });

        nameDiv.innerHTML = '';
        qtyDiv.innerHTML = '';
        priceDiv.innerHTML = '';

        summary.forEach((data, name) => {
          nameDiv.innerHTML += `
      <div class="item-row">
        <span>${name}</span>
        <button
          class="item-delete"
          onclick="removeItem('${data.code}')"
        >
          ✕
        </button>
      </div>
    `;

          qtyDiv.innerHTML += `
      <div class="qty-row">
        <button
          class="qty-btn"
          onclick="decreaseItem('${data.code}')"
        >−</button>

        <span>${data.count}${unitQty}</span>

        <button
          class="qty-btn"
          onclick="increaseItem('${data.code}')"
        >+</button>
      </div>
    `;

          priceDiv.innerHTML += `
      <div class="price-row">
        ${data.totalPrice.toLocaleString()}${unitWon}
      </div>
    `;
        });

        nameDiv.scrollTop = nameDiv.scrollHeight;
        qtyDiv.scrollTop = qtyDiv.scrollHeight;
        priceDiv.scrollTop = priceDiv.scrollHeight;
      }

      function openCart() {
        document.getElementById('screen-main').style.display = 'none';

        list.innerHTML = '';
        const summary = {};

        scannedParts.forEach((p) => {
          const currentName = assetsInfo[p.code].name;
          if (!summary[currentName]) {
            summary[currentName] = { count: 0, totalPrice: 0 };
          }
          summary[currentName].count += 1;
          summary[currentName].totalPrice += p.price;
          grandTotal += p.price;
        });

        Object.entries(summary).forEach(([name, data]) => {
          list.innerHTML += `
            <div style="display:flex; justify-content:space-between; margin-bottom:1.5vh;">
                <span>${name} (${data.count}${unitQty})</span>
                <span style="color:var(--stroke-orange); font-weight:900;">${data.totalPrice.toLocaleString()}${unitWon}</span>
            </div>

        document.getElementById('cart-total-price').innerText =

        const doc = iframe.contentWindow.document;

          </html>
        `);
        doc.close();

        globalLangBox.style.display = 'none';
        if (globalBackBox) globalBackBox.style.display = 'none';

        const images = doc.images;
        let loaded = 0;

        function tryPrint() {
          loaded++;

          if (loaded >= images.length) {
            iframe.contentWindow.focus();

          }

        for (let img of images) {
          if (img.complete) {
            tryPrint();
          } else {
            img.onload = tryPrint;
            img.onerror = tryPrint;
          }
        }

        setTimeout(() => {
          document.body.removeChild(iframe);
          location.reload();
        }, 300);

      function increaseItem(code) {
        scannedParts.push({
          code: code,
          name: assetsInfo[code].name,
          price: assetsInfo[code].price,
          randomX: (Math.random() - 0.5) * 180,
          randomY: (Math.random() - 0.5) * 300,
        });

        updateDashboards();
        draw();
      }

      function decreaseItem(code) {
        const idx = scannedParts.findLastIndex(
          (p) => String(p.code) === String(code),
        );

        if (idx !== -1) {
          scannedParts.splice(idx, 1);
        }

        updateDashboards();
        draw();
      }

      function removeItem(code) {
        scannedParts = scannedParts.filter(
          (p) => String(p.code) !== String(code),
        );

        updateDashboards();
        draw();
      }

      const languageBtn = document.querySelector('.language-btn');
      languageBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        globalLangBox.classList.toggle('open');
      });
      document.addEventListener('click', () => {
        globalLangBox.classList.remove('open');
      });

      const targetButtons =
        '.btn-pay-active, .btn-back-style, .language-btn, .language-item';

      function addTouchEffect(target) {
        const btn = target.closest(targetButtons);
        if (btn) {
          btn.classList.add('js-touched');
        }
      }

      function removeTouchEffect(target) {
        const btn = target.closest(targetButtons);
        if (btn) {
          setTimeout(() => {
            btn.classList.remove('js-touched');
          }, 80);
        }
      }

      document.addEventListener(
        'touchstart',
        (e) => {
          addTouchEffect(e.target);
        },
        { passive: true },
      );
      document.addEventListener(
        'touchend',
        (e) => {
          removeTouchEffect(e.target);
        },
        { passive: true },
      );
      document.addEventListener('mousedown', (e) => {
        addTouchEffect(e.target);
      });
      document.addEventListener('mouseup', (e) => {
        removeTouchEffect(e.target);
      });
      document.addEventListener('pointerdown', (e) => {
        addTouchEffect(e.target);
      });
      document.addEventListener('pointerup', (e) => {
        removeTouchEffect(e.target);
      });
