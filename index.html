<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE FAKE SHOP / 2026</title>

    <style>
      /* 둥글둥글하고 통통한 느낌의 구글 폰트(Jua, Fredoka) 로드 */
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Jua&family=Montserrat:wght@700;900&display=swap');

      :root {
        --main-yellow: #fbf9e6;
        --point-red: #f15a31;
        --stroke-orange: #d74b29;
        --point-blue: #7cb8f7;
        --text-dark: #222222;
      }

      body,
      html {
        background: #000;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: 'Jua', 'Fredoka', sans-serif;
        overflow: hidden;
      }

      #kiosk-frame {
        width: 100%;
        height: 100vh;
        position: relative;
        background: var(--main-yellow);
        overflow: hidden;
        cursor: pointer;
      }

      #video-background {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }

      #screen-start {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .touch-msg {
        font-size: 3.2vh;
        font-weight: 400;
        text-align: center;
        color: #000;
        animation: text-glow-pulse 3s infinite ease-in-out;
      }

      @keyframes text-glow-pulse {
        0%,
        100% {
          color: #000000;
        }
        50% {
          color: #ffffff;
          text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }
      }

      #screen-main {
        display: none;
        width: 100%;
        height: 100%;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        background: var(--main-yellow);
        z-index: 1100;
      }

      .scan-header {
        width: 100%;
        padding: 8vh 0 1vh 0;
        text-align: center;
      }

      .scan-title {
        font-size: 4vh;
        color: var(--main-yellow);
        margin: 0;
        letter-spacing: 0.1vh;
        font-weight: 900;
        text-shadow:
          -1.5px -1.5px 0 var(--stroke-orange),
          1.5px -1.5px 0 var(--stroke-orange),
          -1.5px 1.5px 0 var(--stroke-orange),
          1.5px 1.5px 0 var(--stroke-orange),
          0px -1.5px 0 var(--stroke-orange),
          0px 1.5px 0 var(--stroke-orange),
          -1.5px 0px 0 var(--stroke-orange),
          1.5px 0px 0 var(--stroke-orange);
      }

      #canvas-container {
        margin: 1vh auto;
        width: 65vh;
        height: 65vh;
        max-width: 90vw;
        border: 5px dashed var(--stroke-orange);
        border-radius: 3vh;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.4);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .scan-dashboard {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 20vh;
        background: var(--point-blue);
        color: #fff;
        display: flex;
        padding: 1.5vh 0;
        box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      .dash-section {
        flex: 1.2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        border-right: 1px solid rgba(255, 255, 255, 0.4);
        padding-top: 1vh;
      }
      .dash-section:nth-child(1) {
        flex: 1.4;
      }
      .dash-section:nth-child(2) {
        flex: 0.7;
      }
      .dash-section:nth-child(3) {
        flex: 1.4;
      }
      .dash-section:last-child {
        border-right: none;
        flex: 1.3;
        justify-content: center;
        padding-top: 0;
      }

      .dash-label {
        font-size: 2vh;
        color: var(--main-yellow);
        margin-bottom: 1.5vh;
        font-weight: 900;
        text-shadow:
          -1px -1px 0 var(--stroke-orange),
          1px -1px 0 var(--stroke-orange),
          -1px 1px 0 var(--stroke-orange),
          1px 1px 0 var(--stroke-orange),
          0px -1px 0 var(--stroke-orange),
          0px 1px 0 var(--stroke-orange),
          -1px 0px 0 var(--stroke-orange),
          1px 0px 0 var(--stroke-orange);
      }

      .list-container {
        width: 90%;
        height: 12vh;
        overflow-y: hidden;
        display: flex;
        flex-direction: column;
        gap: 0.8vh;
        font-size: 2.1vh;
        text-align: center;
        color: var(--text-dark);
      }

      .qty-row,
      .price-row {
        color: var(--stroke-orange);
        font-weight: 700;
      }

      .btn-pay-active {
        background: var(--point-red);
        color: #fff;
        border: 3px solid #fff;
        padding: 2.2vh 3.5vh;
        border-radius: 2vh;
        font-size: 2.5vh;
        cursor: pointer;
        font-family: 'Jua', sans-serif;
        box-shadow: 0 4px 0px rgba(0, 0, 0, 0.1);
      }

      .modal {
        display: none;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        background: var(--main-yellow);
        z-index: 1200;
      }

      .modal-title {
        font-size: 6vh;
        margin-bottom: 4vh;
        color: var(--main-yellow);
        font-weight: 900;
        text-shadow:
          -2px -2px 0 var(--stroke-orange),
          2px -2px 0 var(--stroke-orange),
          -2px 2px 0 var(--stroke-orange),
          2px 2px 0 var(--stroke-orange),
          0px -2px 0 var(--stroke-orange),
          0px 2px 0 var(--stroke-orange),
          -2px 0px 0 var(--stroke-orange),
          2px 0px 0 var(--stroke-orange);
      }

      #cart-list {
        width: 65%;
        background: white;
        padding: 3vh 4vh;
        border: 4px solid var(--point-blue);
        border-radius: 2.5vh;
        color: var(--text-dark);
        margin-bottom: 4vh;
        font-size: 2.4vh;
        max-height: 40vh;
        overflow-y: auto;
      }

      #cart-list::-webkit-scrollbar {
        width: 12px;
      }
      #cart-list::-webkit-scrollbar-track {
        background: var(--main-yellow);
        border-radius: 10px;
      }
      #cart-list::-webkit-scrollbar-thumb {
        background: var(--point-blue);
        border: 2px solid #fff;
        border-radius: 10px;
      }

      .cart-total-bar {
        width: 65%;
        text-align: right;
        font-size: 3.2vh;
        color: var(--stroke-orange);
        margin-bottom: 4vh;
        font-weight: 900;
      }

      /* 🌐 좌측 상단 이전으로 배치 레이어 상자 */
      .back-box {
        display: none;
        position: absolute;
        top: 2vh;
        left: 4vw;
        z-index: 1300;
      }

      /* 🌟 [수정] 한글 주아체('Jua')를 우선순위 1등으로 적용하여 동글동글 통통하게 매핑 */
      .btn-back-style {
        background: white;
        border: 3px solid var(--point-blue);
        border-radius: 999px;
        padding: 0.8vh 3.2vh;
        font-size: 2.2vh;
        font-weight: 700;
        cursor: pointer;
        color: var(--stroke-orange);
        box-shadow: 0 4px 0px rgba(0, 0, 0, 0.05);
        letter-spacing: -0.05vw;
        transition: 0.1s;
        font-family:
          'Jua', 'Fredoka', sans-serif !important; /* 👈 한글/영어 폰트 셋트 완벽 매핑 */
      }

      /* 🌐 우측 상단 언어 선택 제어 박스 */
      .language-box {
        display: none;
        position: absolute;
        top: 2vh;
        right: 4vw;
        z-index: 1300;
      }

      /* 🌟 [수정] 언어 버튼도 일관성을 위해 주아체와 Fredoka를 혼용 매핑 */
      .language-btn {
        background: white;
        border: 3px solid var(--point-blue);
        border-radius: 999px;
        padding: 0.8vh 2.5vh;
        font-size: 2.2vh;
        font-weight: 700;
        cursor: pointer;
        color: var(--stroke-orange);
        box-shadow: 0 4px 0px rgba(0, 0, 0, 0.05);
        letter-spacing: 0.05vw;
        transition: 0.1s;
        font-family:
          'Jua', 'Fredoka', sans-serif !important; /* 👈 서체 엔진 완전 교환 */
      }

      .language-menu {
        display: none;
        margin-top: 1vh;
        background: white;
        border: 3px solid var(--point-blue);
        border-radius: 1.5vh;
        overflow: hidden;
        min-width: 140px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      }

      .language-item {
        padding: 1.2vh 2vh;
        cursor: pointer;
        color: var(--text-dark);
        font-size: 2vh;
        font-weight: 700;
        background: white;
        transition: 0.2s;
        text-align: center;
        font-family: 'Jua', 'Fredoka', sans-serif !important;
      }

      .language-item:hover {
        background: var(--point-blue);
        color: white;
      }
      .language-box.open .language-menu {
        display: block;
      }

      #barcode-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      #print-receipt-zone {
        display: none;
      }

      /* PRINT STYLE */
      @media print {
        @page {
          size: 58mm auto;
          margin: 0;
        }
        body {
          background: white !important;
          font-family: monospace !important;
        }
        #kiosk-frame,
        #screen-main,
        #modal-cart,
        #video-background,
        #screen-start,
        .language-box,
        .back-box {
          display: none !important;
        }
        #print-receipt-zone {
          display: block !important;
          width: 46mm !important;
          margin: 0 !important;
          padding: 10mm 3mm 10mm 3mm !important;
          box-sizing: border-box !important;
          color: #000 !important;
          background: #fff !important;
          font-family: monospace;
          font-size: 11px;
          line-height: 1.4;
          position: relative !important;
          left: -1mm !important;
        }
        .print-title {
          text-align: center;
          font-size: 16px;
          font-weight: bold;
          margin: 10px 0 2px 0;
        }
        .print-divider {
          border-top: 1px dashed #000;
          margin: 8px 0;
        }
        .receipt-face-wrapper {
          position: relative !important;
          width: 54mm !important;
          height: 54mm !important;
          margin-top: 6mm !important;
          margin-bottom: 6mm !important;
          margin-left: -6mm !important;
          overflow: hidden !important;
          background: #fff !important;
          filter: grayscale(1) contrast(1.6) !important;
        }
        .receipt-base-img {
          width: 100% !important;
          height: 100% !important;
          display: block !important;
          object-fit: cover !important;
        }
        .receipt-part-img {
          position: absolute !important;
          width: 48mm !important;
          height: 48mm !important;
          top: 0 !important;
          left: 0 !important;
          object-fit: cover !important;
          transform-origin: top left !important;
          mix-blend-mode: multiply !important;
          filter: grayscale(1) brightness(0) contrast(999) !important;
          image-rendering: pixelated !important;
        }
        .print-row {
          display: flex;
          justify-content: space-between;
          margin: 4px 0;
          font-size: 11px;
        }
        .print-footer {
          text-align: center;
          margin-top: 15px;
          font-size: 10px;
        }
        .cut-space {
          height: 20mm;
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="back-box" id="global-back-box">
      <button
        class="btn-back-style"
        id="btn-top-back"
        onclick="handleBackAction()"
      >
        이전으로
      </button>
    </div>

    <div class="language-box" id="global-lang-box">
      <button class="language-btn">LANGUAGE</button>
      <div class="language-menu">
        <div class="language-item" onclick="changeToKorean()">한국어</div>
        <div class="language-item" onclick="loadEnglishScript()">ENGLISH</div>
      </div>
    </div>

    <div id="kiosk-frame">
      <video id="video-background" autoplay muted loop playsinline>
        <source src="intro_video.mp4" type="video/mp4" />
      </video>

      <div id="screen-start" onclick="startKiosk()">
        <div class="touch-msg" id="text-touch-msg">화면을 터치해 주세요.</div>
      </div>

      <div id="screen-main">
        <div class="scan-header">
          <h1 class="scan-title" id="text-scan-title">
            상품 바코드를 스캔해 주세요
          </h1>
        </div>

        <div id="canvas-container">
          <canvas id="faceCanvas" width="1280" height="1280"></canvas>
        </div>

        <div class="scan-dashboard">
          <div class="dash-section">
            <div class="dash-label" id="lbl-dash-name">상품 이름</div>
            <div id="dash-name-list" class="list-container"></div>
          </div>

          <div class="dash-section">
            <div class="dash-label" id="lbl-dash-qty">수량</div>
            <div id="dash-qty-list" class="list-container"></div>
          </div>

          <div class="dash-section">
            <div class="dash-label" id="lbl-dash-price">금액</div>
            <div id="dash-price-list" class="list-container"></div>
          </div>

          <div class="dash-section">
            <button
              class="btn-pay-active"
              id="btn-open-cart"
              onclick="openCart()"
            >
              결제하기
            </button>
          </div>
        </div>
      </div>

      <div id="modal-cart" class="modal">
        <h1 class="modal-title" id="text-modal-title">주문 리스트 확인</h1>
        <div id="cart-list"></div>
        <div class="cart-total-bar" id="cart-total-price">
          총 결제 금액: 0원
        </div>

        <button
          class="btn-pay-active"
          id="btn-final-pay"
          onclick="actionPrintAndReset()"
        >
          최종 결제 진행
        </button>
      </div>

      <input type="text" id="barcode-input" />
    </div>

    <div id="print-receipt-zone">
      <div class="print-title">THE FAKE SHOP</div>
      <div style="text-align: center; font-size: 9px" id="print-date"></div>
      <div class="print-divider"></div>
      <div class="receipt-face-wrapper" id="receipt-face-box">
        <img
          class="receipt-base-img"
          src="assets/base_face.png"
          alt="베이스 얼굴"
        />
      </div>
      <div class="print-divider"></div>
      <div
        style="font-weight: bold; margin-bottom: 5px"
        id="text-receipt-list-title"
      >
        [구매 확정 목록]
      </div>
      <div id="print-items-body"></div>
      <div class="print-divider"></div>
      <div class="print-row" style="font-weight: bold; font-size: 12px">
        <span id="text-receipt-total-qty">총 수량</span>
        <span id="print-total-count">0개</span>
      </div>
      <div
        class="print-row"
        style="font-weight: bold; font-size: 13px; margin-top: 2px"
      >
        <span id="text-receipt-total-price">총 결제 금액</span>
        <span id="print-total-price-zone">0원</span>
      </div>
      <div class="print-divider"></div>
      <div class="print-footer" id="text-receipt-footer">
        귀하의 신원 데이터는 수집 완료되었습니다.<br />
        이용해 주셔서 감사합니다.
      </div>
      <div class="cut-space"></div>
    </div>

    <script>
      let currentLang = 'ko';
      let unitQty = '개';
      let unitWon = '원';
      let textModalTotal = '총 결제 금액: ';
      let textBtnBack = '이전으로';

      const canvas = document.getElementById('faceCanvas');
      const ctx = canvas.getContext('2d');
      const barcodeInput = document.getElementById('barcode-input');
      const globalLangBox = document.getElementById('global-lang-box');
      const globalBackBox = document.getElementById('global-back-box');

      let scannedParts = [];

      const assetsInfo = {
        2030999: {
          name: '안유진의 눈',
          type: 'eye',
          src: 'assets/eye_yujin.png',
          price: 2748000,
        },
        1392010: {
          name: '오준현 교수님의 눈',
          type: 'eye',
          src: 'assets/eye_prof.png',
          price: 549000,
        },
        5203344587: {
          name: '신세경의 코',
          type: 'nose',
          src: 'assets/nose_sekyung.png',
          price: 142000,
        },
        77588517748: {
          name: '이도현의 입',
          type: 'mouth',
          src: 'assets/mouth_dohyun.png',
          price: 156000,
        },
        30920: {
          name: '비비의 점',
          type: 'mole',
          src: 'assets/mole_bibi.png',
          price: 53000,
        },
      };

      const baseImg = new Image();
      baseImg.src = 'assets/base_face.png';

      const loadedImages = {};

      Object.keys(assetsInfo).forEach((code) => {
        const img = new Image();
        img.src = assetsInfo[code].src;
        loadedImages[code] = img;
        img.onload = draw;
      });

      function startKiosk() {
        document.getElementById('screen-start').style.display = 'none';
        document.getElementById('screen-main').style.display = 'flex';
        globalLangBox.style.display = 'block';
        globalBackBox.style.display = 'block';
        barcodeInput.focus();
        draw();
      }

      function handleBackAction() {
        if (document.getElementById('modal-cart').style.display === 'flex') {
          document.getElementById('modal-cart').style.display = 'none';
          document.getElementById('screen-main').style.display = 'flex';
          barcodeInput.focus();
        } else {
          scannedParts = [];
          updateDashboards();
          draw();
          document.getElementById('screen-main').style.display = 'none';
          globalLangBox.style.display = 'none';
          globalBackBox.style.display = 'none';
          document.getElementById('screen-start').style.display = 'flex';
        }
      }

      function draw() {
        ctx.clearRect(0, 0, 1280, 1280);
        if (baseImg.complete) {
          const scale = Math.max(1280 / baseImg.width, 1280 / baseImg.height);
          const x = (1280 - baseImg.width * scale) / 2;
          const y = (1280 - baseImg.height * scale) / 2;
          ctx.drawImage(
            baseImg,
            x,
            y,
            baseImg.width * scale,
            baseImg.height * scale,
          );
        }
        const sortedParts = [...scannedParts].sort((a, b) => {
          if (assetsInfo[a.code].type === 'mole') return 1;
          if (assetsInfo[b.code].type === 'mole') return -1;
          return 0;
        });
        sortedParts.forEach((part) => {
          const img = loadedImages[part.code];
          if (img && img.complete) {
            ctx.drawImage(img, part.randomX, part.randomY, 1280, 1280);
          }
        });
      }

      barcodeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = e.target.value.replace(/\s/g, '').trim();
          const info = assetsInfo[val];
          if (info) {
            scannedParts.push({
              code: val,
              name: info.name,
              price: info.price,
              randomX: (Math.random() - 0.5) * 180,
              randomY: (Math.random() - 0.5) * 300,
            });
            updateDashboards();
            draw();
          }
          e.target.value = '';
        }
      });

      function updateDashboards() {
        const nameDiv = document.getElementById('dash-name-list');
        const qtyDiv = document.getElementById('dash-qty-list');
        const priceDiv = document.getElementById('dash-price-list');
        const summary = {};

        scannedParts.forEach((p) => {
          const currentName = assetsInfo[p.code].name;
          if (!summary[currentName]) {
            summary[currentName] = { count: 0, totalPrice: 0 };
          }
          summary[currentName].count += 1;
          summary[currentName].totalPrice += p.price;
        });

        nameDiv.innerHTML = '';
        qtyDiv.innerHTML = '';
        priceDiv.innerHTML = '';
        Object.entries(summary).forEach(([name, data]) => {
          nameDiv.innerHTML += `<div>${name}</div>`;
          qtyDiv.innerHTML += `<div class="qty-row">${data.count}${unitQty}</div>`;
          priceDiv.innerHTML += `<div class="price-row">${data.totalPrice.toLocaleString()}${unitWon}</div>`;
        });
      }

      function openCart() {
        document.getElementById('screen-main').style.display = 'none';
        const list = document.getElementById('cart-list');
        list.innerHTML = '';
        const summary = {};
        let grandTotal = 0;

        scannedParts.forEach((p) => {
          const currentName = assetsInfo[p.code].name;
          if (!summary[currentName]) {
            summary[currentName] = { count: 0, totalPrice: 0 };
          }
          summary[currentName].count += 1;
          summary[currentName].totalPrice += p.price;
          grandTotal += p.price;
        });

        Object.entries(summary).forEach(([name, data]) => {
          list.innerHTML += `
            <div style="display:flex; justify-content:space-between; margin-bottom:1.5vh;">
                <span>${name} (${data.count}${unitQty})</span>
                <span style="color:var(--stroke-orange); font-weight:900;">${data.totalPrice.toLocaleString()}${unitWon}</span>
            </div>
          `;
        });
        document.getElementById('cart-total-price').innerText =
          `${textModalTotal}${grandTotal.toLocaleString()}${unitWon}`;
        document.getElementById('modal-cart').style.display = 'flex';
      }

      function actionPrintAndReset() {
        const faceBox = document.getElementById('receipt-face-box');
        const oldParts = faceBox.querySelectorAll('.receipt-part-img');
        oldParts.forEach((el) => el.remove());

        const sortedParts = [...scannedParts].sort((a, b) => {
          if (assetsInfo[a.code].type === 'mole') return 1;
          if (assetsInfo[b.code].type === 'mole') return -1;
          return 0;
        });

        sortedParts.forEach((part) => {
          const imgTag = document.createElement('img');
          imgTag.className = 'receipt-part-img';
          imgTag.src = assetsInfo[part.code].src;
          const scaleRatio = 48 / 1280;
          const moveX = part.randomX * scaleRatio;
          const moveY = part.randomY * scaleRatio;
          imgTag.style.transform = `translate(${moveX}mm, ${moveY}mm)`;
          faceBox.appendChild(imgTag);
        });

        document.getElementById('print-date').innerText =
          new Date().toLocaleString();
        const printItemsBody = document.getElementById('print-items-body');
        printItemsBody.innerHTML = '';

        const summary = {};
        let grandTotal = 0;
        scannedParts.forEach((p) => {
          const currentName = assetsInfo[p.code].name;
          if (!summary[currentName]) {
            summary[currentName] = { count: 0, totalPrice: 0 };
          }
          summary[currentName].count += 1;
          summary[currentName].totalPrice += p.price;
          grandTotal += p.price;
        });

        let finalTotalCount = 0;
        Object.entries(summary).forEach(([name, data]) => {
          finalTotalCount += data.count;
          printItemsBody.innerHTML += `<div class="print-row"><span>${name} x${data.count}</span><span>${data.totalPrice.toLocaleString()}${unitWon}</span></div>`;
        });

        document.getElementById('print-total-count').innerText =
          finalTotalCount + unitQty;
        document.getElementById('print-total-price-zone').innerText =
          grandTotal.toLocaleString() + unitWon;
        globalLangBox.style.display = 'none';
        globalBackBox.style.display = 'none';

        setTimeout(() => {
          window.print();
        }, 500);
        window.onafterprint = () => {
          location.reload();
        };
      }

        if (document.getElementById('screen-main').style.display === 'flex') {
          barcodeInput.focus();
        }
      });
