<!doctype html>
<html lang="ko">

      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Jua&family=Montserrat:wght@700;900&display=swap');

      :root {
        --main-yellow: #fbf9e6;
        --point-red: #f15a31;
        --stroke-orange: #d74b29;
        --point-blue: #7cb8f7;
        --text-dark: #222222;
      }

      body,
      html {
        background: #000;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: 'Jua', 'Fredoka', sans-serif;
        overflow: hidden;
      }

      #kiosk-frame {
        width: 100%;
        height: 100vh;
        position: relative;
        background: var(--main-yellow);
        overflow: hidden;
        cursor: pointer;
      }

      #video-background {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }

      #screen-start {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .touch-msg {
        font-size: 3.2vh;
        font-weight: 400;
        text-align: center;
        color: #000;
        animation: text-glow-pulse 3s infinite ease-in-out;
      }

      @keyframes text-glow-pulse {
        0%,
        100% {
          color: #000000;
        }
        50% {
          color: #ffffff;
          text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }
      }

      /* 메인 스캔 화면 구역 왼쪽으로 20px 안전 이동 */
      #screen-main {
        display: none;
        width: 100%;
        height: 100%;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: -20px;
        background: var(--main-yellow);
        z-index: 1100;
      }

      .scan-header {
        width: 100%;
        padding: 8vh 0 1vh 0;
        text-align: center;
      }

      .scan-title {
        font-size: 4vh;
        color: var(--main-yellow);
        margin: 0;
        letter-spacing: 0.1vh;
        font-weight: 900;
        text-shadow:

          1.5px -1.5px 0 var(--stroke-orange),
          -1.5px 1.5px 0 var(--stroke-orange),
          1.5px 1.5px 0 var(--stroke-orange),

          0px 1.5px 0 var(--stroke-orange),
          -1.5px 0px 0 var(--stroke-orange),

        width: 65vh;
        height: 65vh;
        max-width: 90vw;
        border: 5px dashed var(--stroke-orange);
        border-radius: 3vh;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.4);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .scan-dashboard {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 20vh;
        background: var(--point-blue);
        color: #fff;
        display: flex;
        padding: 1.5vh 0;
        box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      .dash-section {
        flex: 1.2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        border-right: 1px solid rgba(255, 255, 255, 0.4);
        padding-top: 1vh;
      }
      .dash-section:nth-child(1) {
        flex: 1.4;
      }
      .dash-section:nth-child(2) {
        flex: 0.7;
      }
      .dash-section:nth-child(3) {
        flex: 1.4;
      }
      .dash-section:last-child {
        border-right: none;
        flex: 1.3;
        justify-content: center;
        padding-top: 0;
      }

      .dash-label {
        font-size: 2vh;
        color: var(--main-yellow);
        margin-bottom: 1.5vh;
        font-weight: 900;
        text-shadow:
          -1px -1px 0 var(--stroke-orange),
          1px -1px 0 var(--stroke-orange),
          -1px 1px 0 var(--stroke-orange),
          1px 1px 0 var(--stroke-orange),
          0px -1px 0 var(--stroke-orange),
          0px 1px 0 var(--stroke-orange),
          -1px 0px 0 var(--stroke-orange),
          1px 0px 0 var(--stroke-orange);

        overflow-y: hidden;
        display: flex;
        flex-direction: column;
        gap: 0.8vh;
        font-size: 2.1vh;
        text-align: center;
        color: var(--text-dark);
      }

      .qty-row,
      .price-row {
        color: var(--stroke-orange);
        font-weight: 700;
      }

      .btn-pay-active {
        background: var(--point-red) !important;
        color: #fff !important;
        border: 3px solid #fff !important;
        padding: 1.5vh 3vh !important;
        border-radius: 2vh !important;
        font-size: 2.3vh !important;
        cursor: pointer;
        font-family: 'Jua', sans-serif !important;
        box-shadow: 0 5px 0px var(--stroke-orange) !important;
        transition:
          transform 0.05s ease-out,
          box-shadow 0.05s ease-out,
          background-color 0.05s ease-out !important;
        transform: translateY(0px);
        -webkit-tap-highlight-color: transparent;
      }

      .btn-pay-active.js-touched {
        background-color: var(--stroke-orange) !important;
        box-shadow: 0 2px 0px rgba(0, 0, 0, 0.2) !important;
        transform: translateY(3px) !important;
      }

      .modal {
        display: none;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        background: var(--main-yellow);
        z-index: 1200;
      }

      .modal-title {

        margin-bottom: 4vh;

          -2px 2px 0 var(--stroke-orange),
          2px 2px 0 var(--stroke-orange),
          0px -2px 0 var(--stroke-orange),
          0px 2px 0 var(--stroke-orange),
          -2px 0px 0 var(--stroke-orange),
          2px 0px 0 var(--stroke-orange);

        border: 4px solid var(--point-blue);
        border-radius: 2.5vh;
        color: var(--text-dark);
        margin-bottom: 4vh;
        font-size: 2.4vh;
        max-height: 40vh;
        overflow-y: auto;

        width: 12px;
      }

        background: var(--main-yellow);

      }
      #cart-list::-webkit-scrollbar-thumb {
        background: var(--point-blue);

        border-radius: 10px;
      }

      .cart-total-bar {
        width: 65%;
        text-align: right;
        font-size: 3.2vh;
        color: var(--stroke-orange);
        margin-bottom: 4vh;
        font-weight: 900;
      }

      .back-box {
        display: none;
        position: absolute;
        top: 2vh;
        left: 4vw;
        z-index: 1300;
      }

        border: 3px solid var(--point-blue) !important;
        border-radius: 999px !important;
        padding: 0.8vh 3.2vh !important;

        font-weight: 700 !important;

      .language-box {
        display: block;
        position: absolute;
        top: 2vh;
        right: 4vw;
        z-index: 1300;
      }

      .language-btn {
        background: white !important;
        border: 3px solid var(--point-blue) !important;
        border-radius: 999px !important;
        padding: 0.8vh 2.5vh !important;
        font-size: 2.2vh;
        font-weight: 700 !important;
        cursor: pointer;
        color: var(--stroke-orange) !important;

        display: none;
        margin-top: 1vh;
        background: white;
        border: 3px solid var(--point-blue);
        border-radius: 1.5vh;
        overflow: hidden;
        min-width: 140px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);

        padding: 1.2vh 2vh !important;
        cursor: pointer;
        color: var(--text-dark) !important;
        font-size: 2vh !important;
        font-weight: 700 !important;
        background: white !important;

          color 0.05s ease-out !important;
        text-align: center !important;
        font-family: 'Jua', 'Fredoka', sans-serif !important;
        -webkit-tap-highlight-color: transparent;

        background-color: var(--point-red) !important;
        color: white !important;
      }

      .language-box.open .language-menu {
        display: block;
      }

      #barcode-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      #print-receipt-zone {
        display: none;
      }
    </style>
  </head>

      document.addEventListener('contextmenu', (e) => e.preventDefault());

    <div class="back-box" id="global-back-box">

        class="btn-back-style"

    </div>

    <div class="language-box" id="global-lang-box">

      function draw() {
        ctx.clearRect(0, 0, 1280, 1280);
        if (baseImg.complete) {
          const scale = Math.max(1280 / baseImg.width, 1280 / baseImg.height);
          const x = (1280 - baseImg.width * scale) / 2;
          const y = (1280 - baseImg.height * scale) / 2;
          ctx.drawImage(
            baseImg,
            x,
            y,
            baseImg.width * scale,
            baseImg.height * scale,
          );
        }
        const sortedParts = [...scannedParts].sort((a, b) => {
          if (assetsInfo[a.code].type === 'mole') return 1;
          if (assetsInfo[b.code].type === 'mole') return -1;
          return 0;
        });
        sortedParts.forEach((part) => {
          const img =
            loadedImages[part.code] || loadedImages[String(part.code)];
          if (img && img.complete) {
            ctx.drawImage(img, part.randomX, part.randomY, 1280, 1280);
          }
        });
      }

      barcodeInput.addEventListener('keydown', (e) => {

          const valStr = e.target.value.replace(/\s/g, '').trim();
          const valNum = Number(valStr);
          const info = assetsInfo[valStr] || assetsInfo[valNum];

          if (info) {
            const exactCode =
              Object.keys(assetsInfo).find(
                (key) => key == valStr || Number(key) == valNum,
              ) || valStr;

            scannedParts.push({
              code: exactCode,
              name: info.name,
              price: info.price,
              randomX: (Math.random() - 0.5) * 180,
              randomY: (Math.random() - 0.5) * 300,
            });
            updateDashboards();
            draw();
          }
          e.target.value = '';
        }
      });

        scannedParts.forEach((p) => {
          const currentName = assetsInfo[p.code].name;
          if (!summary[currentName]) {
            summary[currentName] = { count: 0, totalPrice: 0 };
          }
          summary[currentName].count += 1;
          summary[currentName].totalPrice += p.price;
        });

        nameDiv.innerHTML = '';
        qtyDiv.innerHTML = '';
        priceDiv.innerHTML = '';
        Object.entries(summary).forEach(([name, data]) => {
          nameDiv.innerHTML += `<div>${name}</div>`;

      const targetButtons =
        '.btn-pay-active, .btn-back-style, .language-btn, .language-item';

      function addTouchEffect(target) {
        const btn = target.closest(targetButtons);
        if (btn) {
          btn.classList.add('js-touched');
        }
      }

      function removeTouchEffect(target) {
        const btn = target.closest(targetButtons);
        if (btn) {
          setTimeout(() => {
            btn.classList.remove('js-touched');
          }, 80);
        }
      }

      document.addEventListener(
        'touchstart',
        (e) => {
          addTouchEffect(e.target);
        },
        { passive: true },
      );
      document.addEventListener(
        'touchend',
        (e) => {
          removeTouchEffect(e.target);
        },
        { passive: true },
      );
      document.addEventListener('mousedown', (e) => {
        addTouchEffect(e.target);
      });
      document.addEventListener('mouseup', (e) => {
        removeTouchEffect(e.target);
      });
      document.addEventListener('pointerdown', (e) => {
        addTouchEffect(e.target);
      });
      document.addEventListener('pointerup', (e) => {
        removeTouchEffect(e.target);
