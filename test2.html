<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE FAKE SHOP / 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        :root { --main-yellow: #F8E28C; --point-red: #D1402E; }
        
        body, html { background: #000; margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; }
        
        #kiosk-frame { width: 100%; height: 100vh; position: relative; background: var(--main-yellow); overflow: hidden; cursor: pointer; transition: all 0.05s linear; }
        #video-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        #screen-start { position: absolute; width: 100%; height: 100%; z-index: 100; display: flex; align-items: center; justify-content: center; }
        .touch-msg { font-size: 3.2vh; font-weight: 400; text-align: center; color: #000; animation: text-color-pulse 4s infinite ease-in-out; pointer-events: none; z-index: 101; }
        @keyframes text-color-pulse { 0%, 100% { color: #000; } 50% { color: #eee; } }

        #screen-main { display: none; width: 100%; height: 100%; flex-direction: column; position: absolute; top: 0; left: 0; background: var(--main-yellow); z-index: 1100; }
        .shashasak-in { animation: slideInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) both; }
        @keyframes slideInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .scan-header { width: 100%; padding: 6vh 0 2vh 0; text-align: center; }
        .scan-title { font-size: 3.5vh; font-weight: 700; color: #000; margin: 0; letter-spacing: -0.05vh; }

        #canvas-container { margin: 1vh auto; width: 65vh; height: 65vh; max-width: 90vw; background: transparent; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }

        .scan-dashboard { position: absolute; bottom: 0; width: 100%; height: 20vh; background: #000; color: #fff; display: flex; padding: 1.5vh 0; }
        .dash-section { flex: 1.5; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; border-right: 1px solid #333; padding-top: 1vh; }
        .dash-section:nth-child(2) { flex: 1; }
        .dash-section:last-child { border-right: none; flex: 1.5; }
        .dash-label { font-size: 1.6vh; color: #888; margin-bottom: 1.5vh; }
        
        .list-container { width: 90%; height: 12vh; overflow-y: hidden; display: flex; flex-direction: column; gap: 0.8vh; font-size: 1.8vh; text-align: center; }
        .qty-row { font-weight: 700; color: var(--main-yellow); }

        .btn-pay-active { background: var(--point-red); color: #fff; border: none; padding: 2.5vh 5vh; border-radius: 1vh; font-weight: 900; font-size: 2.5vh; cursor: pointer; transition: 0.3s; }

        .modal { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; flex-direction: column; position: absolute; top: 0; left: 0; background: var(--main-yellow); z-index: 1200; }
        #cart-list { width: 60%; background: white; padding: 3vh; border-radius: 2vh; color: black; margin-bottom: 5vh; font-size: 2.5vh; max-height: 40vh; overflow-y: auto; }
        
        #barcode-input { position: absolute; opacity: 0; pointer-events: none; }

        /* 평소에는 영수증 영역 숨김 */
        #print-receipt-zone { display: none; }

        /* ========================================================
           🖨️ 영수증 실제 출력을 위한 프린트 CSS (CORS 버그 완전 우회)
        ======================================================== */
        @media print {
            body, html, #kiosk-frame, #screen-main, .modal { display: none !important; background: none !important; }
            
            #print-receipt-zone {
                display: block !important;
                width: 58mm;
                margin: 0 auto;
                padding: 0;
                color: #000 !important;
                background: #fff !important;
                font-family: monospace;
                font-size: 11px;
                line-height: 1.4;
            }
            .print-title { text-align: center; font-size: 16px; font-weight: bold; margin: 10px 0 2px 0; }
            .print-divider { border-top: 1px dashed #000; margin: 8px 0; }
            
            /* 영수증 얼굴 사진 조립 레이아웃 구역 */
            .receipt-face-wrapper {
                position: relative;
                width: 54mm;
                height: 54mm;
                margin: 10px auto;
                overflow: hidden;
                background: #fff;
                filter: grayscale(1) contrast(1.6); /* 영수증 특유의 거친 질감 */
            }
            /* 기본 베이스 얼굴 */
            .receipt-base-img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            /* 그 위에 올라갈 랜덤 부품들 */
            .receipt-part-img {
                position: absolute;
                width: 100%;
                height: 100%;
                top: 0; left: 0;
            }

            .print-row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 12px; }
            .print-footer { text-align: center; margin-top: 15px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <div id="kiosk-frame">
        <video id="video-background" autoplay muted loop playsinline><source src="intro_video.mp4" type="video/mp4"></video>
        <div id="screen-start" onclick="startKiosk()"><div class="touch-msg">화면을 터치해 주세요.</div></div>

        <div id="screen-main">
            <div class="scan-header">
                <h1 class="scan-title">상품 바코드를 스캔해 주세요</h1>
            </div>
            <div id="canvas-container"><canvas id="faceCanvas" width="1280" height="1280"></canvas></div>
            
            <div class="scan-dashboard">
                <div class="dash-section"><div class="dash-label">상품 이름</div><div id="dash-name-list" class="list-container"></div></div>
                <div class="dash-section"><div class="dash-label">수량</div><div id="dash-qty-list" class="list-container"></div></div>
                <div class="dash-section">
                    <button id="btn-pay" class="btn-pay-active" style="opacity: 1; pointer-events: auto;" onclick="openCart()">결제하기</button>
                </div>
            </div>
        </div>

        <div id="modal-cart" class="modal">
            <h1 style="font-size: 5vh; font-weight: 900; margin-bottom: 5vh; color: #000;">주문 리스트 확인</h1>
            <div id="cart-list"></div>
            <button class="btn-pay-active" onclick="actionPrintAndReset()">최종 결제 진행</button>
        </div>

        <input type="text" id="barcode-input">
    </div>

    <div id="print-receipt-zone">
        <div class="print-title">THE FAKE SHOP</div>
        <div style="text-align: center; font-size: 9px;" id="print-date"></div>
        <div class="print-divider"></div>
        
        <div class="receipt-face-wrapper" id="receipt-face-box">
            <img class="receipt-base-img" src="base_face.png" alt="베이스 얼굴">
            </div>

        <div class="print-divider"></div>
        <div style="font-weight: bold; margin-bottom: 5px;">[구매 확정 목록]</div>
        <div id="print-items-body"></div>
        <div class="print-divider"></div>
        <div class="print-row" style="font-weight: bold; font-size: 13px;">
            <span>총 수량</span>
            <span id="print-total-count">0개</span>
        </div>
        <div class="print-divider"></div>
        <div class="print-footer">
            귀하의 신원 데이터는 수집 완료되었습니다.<br>
            이용해 주셔서 감사합니다.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('faceCanvas');
        const ctx = canvas.getContext('2d');
        const barcodeInput = document.getElementById('barcode-input');
        
        let scannedParts = []; 

        const assetsInfo = {
            "2030999": { name: "안유진의 눈", type: "eye", src: "eye_yujin.png" },
            "1392010": { name: "오준현 교수님의 눈", type: "eye", src: "eye_prof.png" },
            "5203344587": { name: "신세경의 코", type: "nose", src: "nose_sekyung.png" },
            "77588517748": { name: "이도현의 입", type: "mouth", src: "mouth_dohyun.png" },
            "30920": { name: "비비의 점", type: "mole", src: "mole_bibi.png" }
        };

        const baseImg = new Image(); baseImg.src = 'base_face.png'; 
        const loadedImages = {};
        Object.keys(assetsInfo).forEach(code => {
            const img = new Image(); 
            img.src = assetsInfo[code].src;
            loadedImages[code] = img; img.onload = draw;
        });

        function startKiosk() {
            document.getElementById('screen-start').style.display = 'none';
            const main = document.getElementById('screen-main');
            main.style.display = 'flex';
            main.classList.add('shashasak-in');
            barcodeInput.focus(); draw();
        }

        function draw() {
            ctx.clearRect(0, 0, 1280, 1280);
            
            if (baseImg.complete) {
                const scale = Math.max(1280 / baseImg.width, 1280 / baseImg.height);
                const x = (1280 - baseImg.width * scale) / 2;
                const y = (1280 - baseImg.height * scale) / 2;
                ctx.drawImage(baseImg, x, y, baseImg.width * scale, baseImg.height * scale);
            }
            
            const sortedParts = [...scannedParts].sort((a, b) => {
                if (assetsInfo[a.code].type === 'mole') return 1;
                if (assetsInfo[b.code].type === 'mole') return -1;
                return 0;
            });

            sortedParts.forEach(part => {
                const img = loadedImages[part.code];
                if(img && img.complete) {
                    ctx.save();
                    ctx.globalAlpha = 1.0;
                    ctx.globalCompositeOperation = 'source-over';
                    const pSize = 1280; 
                    ctx.drawImage(img, part.randomX, part.randomY, pSize, pSize);
                    ctx.restore();
                }
            });
        }

        barcodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                const info = assetsInfo[val];
                if (info) {
                    const randX = (Math.random() - 0.5) * 400; 
                    const randY = (Math.random() - 0.5) * 300; 

                    scannedParts.push({ 
                        code: val, 
                        name: info.name,
                        randomX: randX, 
                        randomY: randY
                    });
                    updateDashboards();
                    draw();
                }
                e.target.value = '';
            }
        });

        function updateDashboards() {
            const nameDiv = document.getElementById('dash-name-list');
            const qtyDiv = document.getElementById('dash-qty-list');
            const summary = {};
            scannedParts.forEach(p => { summary[p.name] = (summary[p.name] || 0) + 1; });
            nameDiv.innerHTML = ""; qtyDiv.innerHTML = "";
            Object.entries(summary).forEach(([name, count]) => {
                nameDiv.innerHTML += `<div>${name}</div>`;
                qtyDiv.innerHTML += `<div class="qty-row">${count}</div>`;
            });
        }

        function openCart() {
            document.getElementById('screen-main').style.display = 'none';
            const list = document.getElementById('cart-list'); list.innerHTML = "";
            const summary = {}; scannedParts.forEach(p => { summary[p.name] = (summary[p.name] || 0) + 1; });
            
            if (scannedParts.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#888; padding: 2vh 0;">스캔된 상품이 없습니다. (맨 얼굴 출력 테스트)</div>`;
            } else {
                Object.entries(summary).forEach(([name, count]) => {
                    list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:1vh; border-bottom: 1px dashed #ccc; padding-bottom:0.5vh;"><span>${name}</span><span>${count}개</span></div>`;
                });
            }
            document.getElementById('modal-cart').style.display = 'flex';
        }

        // --- 문제의 캔버스 변환을 생략하고 <img> 스타일 매핑으로 완전히 새로 구축한 인쇄 함수 ---
        function actionPrintAndReset() {
            const faceBox = document.getElementById('receipt-face-box');
            
            // 기존에 쌓여있던 이전 테스트용 부품 이미지 초기화 제거 (베이스 얼굴만 남김)
            const oldParts = faceBox.querySelectorAll('.receipt-part-img');
            oldParts.forEach(el => el.remove());

            // 점(Mole) 최상단 정렬
            const sortedParts = [...scannedParts].sort((a, b) => {
                if (assetsInfo[a.code].type === 'mole') return 1;
                if (assetsInfo[b.code].type === 'mole') return -1;
                return 0;
            });

            // 캔버스에 그렸던 상대적 랜덤 좌표 그대로 <img> 태그를 밀어 넣어 영수증 안에서 조립
            sortedParts.forEach(part => {
                const imgTag = document.createElement('img');
                imgTag.className = 'receipt-part-img';
                imgTag.src = assetsInfo[part.code].src;
                
                // 1280 해상도 캔버스의 오차 범위를 영수증 영역 크기에 맞추는 계산
                // 캔버스에서 가졌던 이동 비율을 그대로 영수증에 대입
                const pctX = (part.randomX / 1280) * 100;
                const pctY = (part.randomY / 1280) * 100;
                
                imgTag.style.transform = `translate(${pctX}%, ${pctY}%)`;
                faceBox.appendChild(imgTag);
            });

            // 날짜 및 데이터 목록 생성
            const now = new Date();
            document.getElementById('print-date').innerText = now.toLocaleString();

            const printItemsBody = document.getElementById('print-items-body');
            printItemsBody.innerHTML = "";
            
            const summary = {};
            scannedParts.forEach(p => { summary[p.name] = (summary[p.name] || 0) + 1; });
            
            let finalTotalCount = 0;
            Object.entries(summary).forEach(([name, count]) => {
                finalTotalCount += count;
                const itemRow = document.createElement('div');
                itemRow.className = 'print-row';
                itemRow.innerHTML = `<span>${name}</span><span>${count}개</span>`;
                printItemsBody.appendChild(itemRow);
            });
            
            if (finalTotalCount === 0) {
                printItemsBody.innerHTML = `<div style="text-align:center; font-size:10px;">- 구매 내역 없음 (기본 모델) -</div>`;
            }
            
            document.getElementById('print-total-count').innerText = finalTotalCount + "개";

            // 변환 대기 시간 필요 없이 즉시 프린트 가동
            setTimeout(() => {
                window.print();
                location.reload(); 
            }, 50);
        }

        document.addEventListener('click', () => { if(document.getElementById('screen-main').style.display === 'flex') barcodeInput.focus(); });
    </script>
</body>
</html>
